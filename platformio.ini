; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
include_dir = include
default_envs = TU_AUTO_Light

[env]
platform = ststm32@20.0.0
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
    platformio/tool-openocd@~3.1200.7
board = nucleo_f411re
framework = cmsis
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 9600
build_flags = -Wl,-u,_printf_float,-u,_scanf_float -std=c11

[env:TU_CreateProject_Example1]
build_src_filter = -<*> +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:TU_GPIO_Digital_Out_LED]
build_src_filter = -<*> +<tutorial/TU_GPIO_Digital_Out_LED_22200063.c> +<include/*.c> -<include/ecSTM32_simple.c>

